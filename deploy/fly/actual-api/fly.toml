# Fly app config for the Actual REST wrapper.
# Expected name: $FLY_APP_PREFIX-api.
# No public ports — reached only on the internal 6PN network at
#   http://<app-name>.internal:5007

primary_region = "sin"

[build]
  dockerfile = "../../../api-scripts/Dockerfile"

# IMPORTANT: the Docker build context must include api-scripts/.
# From repo root: fly deploy -c deploy/fly/actual-api/fly.toml --dockerfile api-scripts/Dockerfile .
# The bootstrap script does this for you.

[env]
  # ACTUAL_SERVER_URL resolves to the sibling server on 6PN:
  #   http://${FLY_APP_PREFIX}-server.internal:5006
  # ACTUAL_PASSWORD and ACTUAL_SYNC_ID come from `fly secrets set`.

[[services]]
  protocol = "tcp"
  internal_port = 5007
  # No ports[] block = internal-only.

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
