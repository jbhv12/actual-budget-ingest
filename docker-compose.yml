services:
  actual_server:
    image: docker.io/actualbudget/actual-server:latest
    ports:
      - '5006:5006'
    environment:
      - ACTUAL_PORT=5006
      - ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB=20
      - ACTUAL_UPLOAD_SYNC_ENCRYPTED_FILE_SYNC_SIZE_LIMIT_MB=50
      - ACTUAL_UPLOAD_FILE_SIZE_LIMIT_MB=20
      - ACTUAL_PASSWORD=${ACTUAL_PASSWORD:?ACTUAL_PASSWORD must be set in .env}
    volumes:
      - ./actual-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'node src/scripts/health-check.js']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  actual_api:
    build: ./api-scripts
    ports:
      - '5007:5007'
    environment:
      - ACTUAL_SERVER_URL=http://actual_server:5006
      - ACTUAL_PASSWORD=${ACTUAL_PASSWORD:?ACTUAL_PASSWORD must be set in .env}
      - ACTUAL_SYNC_ID=${ACTUAL_SYNC_ID:?ACTUAL_SYNC_ID must be set in .env}
    volumes:
      - ./api-scripts/budget-cache:/data/budget-cache
    depends_on:
      actual_server:
        condition: service_healthy
    restart: unless-stopped

  actual_ingest:
    build: ./ingest
    environment:
      - ACTUAL_API_URL=http://actual_api:5007
      - GEMINI_API_KEY=${GEMINI_API_KEY:?GEMINI_API_KEY must be set in .env}
      - HDFC_PDF_PASSWORD=${HDFC_PDF_PASSWORD:?HDFC_PDF_PASSWORD must be set in .env}
      - HDFC_SAVINGS_ACCOUNT_ID=${HDFC_SAVINGS_ACCOUNT_ID:-}
      - INGEST_SOURCE=${INGEST_SOURCE:-folder}
      - INGEST_WATCH_DIR=/data/pdfs
      # Gmail connector (optional, only used when INGEST_SOURCE=gmail)
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID:-}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET:-}
      - GMAIL_REFRESH_TOKEN=${GMAIL_REFRESH_TOKEN:-}
      - GMAIL_LABEL=${GMAIL_LABEL:-actual-ingest}
      - GMAIL_POLL_INTERVAL_SEC=${GMAIL_POLL_INTERVAL_SEC:-900}
    volumes:
      - ./fixtures/pdfs:/data/pdfs
      - ./ingest/banks.yaml:/app/banks.yaml:ro
    depends_on:
      actual_api:
        condition: service_started
    restart: unless-stopped
