services:
  actual_server:
    image: docker.io/actualbudget/actual-server:latest
    ports:
      - '5006:5006'
    environment:
      - ACTUAL_PORT=5006
      - ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB=20
      - ACTUAL_UPLOAD_SYNC_ENCRYPTED_FILE_SYNC_SIZE_LIMIT_MB=50
      - ACTUAL_UPLOAD_FILE_SIZE_LIMIT_MB=20
      - ACTUAL_PASSWORD=${ACTUAL_PASSWORD:?ACTUAL_PASSWORD must be set in .env}
    volumes:
      - ./actual-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'node src/scripts/health-check.js']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  actual_api:
    build: ./api-scripts
    ports:
      - '5007:5007'
    environment:
      - ACTUAL_SERVER_URL=http://actual_server:5006
      - ACTUAL_PASSWORD=${ACTUAL_PASSWORD:?ACTUAL_PASSWORD must be set in .env}
      - ACTUAL_SYNC_ID=${ACTUAL_SYNC_ID:-}
    volumes:
      - ./api-scripts/budget-cache:/data/budget-cache
    depends_on:
      actual_server:
        condition: service_healthy
    restart: unless-stopped

  actual_ingest:
    build: ./ingest
    env_file: .env
    environment:
      - ACTUAL_API_URL=http://actual_api:5007
      - INGEST_WATCH_DIR=/data/pdfs
    volumes:
      - ./fixtures/pdfs:/data/pdfs
      - ./ingest/banks.yaml:/app/banks.yaml:ro
    depends_on:
      actual_api:
        condition: service_healthy
    restart: unless-stopped
